<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <filter id="fav-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="1" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Subtle circular or rounded background for pristine rendering on all browser themes (light & dark) -->
  <rect width="160" height="160" rx="32" fill="#FFFFFF" />
  
  <g filter="url(#fav-shadow)" transform="translate(6, 12)">
    <!-- Red Triangle -->
    <polygon points="12,126 48,24 84,126" fill="#ED1C24" stroke="#C81018" stroke-width="2" stroke-linejoin="round" />
    <polygon points="28,118 48,48 68,118" fill="#FFFFFF" />

    <!-- Blue Diamond -->
    <polygon points="112,20 146,58 112,96 78,58" fill="#0066B2" stroke="#004D86" stroke-width="2" stroke-linejoin="round" />
    <polygon points="112,36 132,58 112,80 92,58" fill="#FFFFFF" />

    <!-- Interlocking Ribbon Loop -->
    <path d="M 44,66 C 44,42 66,32 86,46 C 100,56 102,82 84,96 C 64,110 44,94 44,66 Z" fill="none" stroke="#FFFFFF" stroke-width="10" stroke-linecap="round" />
    <path d="M 44,66 C 44,42 66,32 86,46 C 100,56 102,82 84,96 C 64,110 44,94 44,66 Z" fill="none" stroke="#E2E8F0" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
